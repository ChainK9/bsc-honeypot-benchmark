name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

jobs:
  # Required: needs no network.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test

  # Not required: forks BSC through the BSC_RPC repository variable. Public nodes can be flaky.
  fork:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BSC_RPC: ${{ vars.BSC_RPC }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fork tests
        run: |
          test -n "$BSC_RPC" || { echo "BSC_RPC repository variable is not set"; exit 1; }
          forge test --fork-url "$BSC_RPC"
      - name: Scorer baseline
        run: node score.mjs --fork-url "$BSC_RPC" --detector "node examples/always-ok.mjs {rpc} {token} {pair}"
